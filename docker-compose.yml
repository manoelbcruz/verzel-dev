services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: leilao
      POSTGRES_PASSWORD: leilao
      POSTGRES_DB: leilao
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leilao -d leilao"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://leilao:leilao@db:5432/leilao
      CORS_ORIGINS: http://localhost:8080
      SEED_DEMO: "true"
      # apenas desenvolvimento, produção recusa
      CHAVE_INTEGRIDADE: "1111111111111111111111111111111111111111111111111111111111111111"
      CHAVE_PRIVACIDADE: "2222222222222222222222222222222222222222222222222222222222222222"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 12

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
