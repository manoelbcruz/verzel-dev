[project]
name = "casa-de-leiloes-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.16.1",
    "sqlalchemy[asyncio]==2.1.6",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["pg: requer PostgreSQL em TEST_DATABASE_URL (banco com sufixo _test)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
